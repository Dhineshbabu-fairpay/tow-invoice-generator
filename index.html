<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Editable Tow Invoice · Fairpy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #e5e7eb;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem;
      min-height: 100vh;
    }
    .container {
      max-width: 1000px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    /* Form card - hidden during print */
    .form-card {
      background: white;
      border-radius: 1.5rem;
      padding: 1.8rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    label {
      font-weight: 600;
      font-size: 0.8rem;
      color: #1e293b;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    input, textarea, select {
      padding: 0.6rem 1rem;
      border: 1px solid #d1d5db;
      border-radius: 0.8rem;
      font-size: 0.95rem;
      background: #f9fafb;
      transition: 0.2s;
      font-family: inherit;
      width: 100%;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
      background: white;
    }
    .full-width {
      grid-column: 1 / -1;
    }
    .inline-charges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.7rem;
    }
    .inline-charges input {
      flex: 1 1 140px;
    }
    .inline-charges .small-input {
      max-width: 100px;
      flex: 0 1 100px;
    }
    button {
      background: #0f172a;
      color: white;
      border: none;
      padding: 0.8rem 1.8rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      letter-spacing: 0.3px;
    }
    button:hover {
      background: #1e293b;
    }
    .update-btn {
      background: white;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      box-shadow: none;
      margin-top: 1.2rem;
    }
    .update-btn:hover {
      background: #f1f5f9;
    }
    .action-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
    }
    .distance-grid {
      background: #f1f5f9;
      padding: 0.8rem 1rem;
      border-radius: 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem 1.5rem;
    }
    .distance-grid span {
      font-weight: 500;
      font-size: 0.85rem;
      color: #1e293b;
    }
    .distance-grid .badge {
      background: #e2e8f0;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #0f172a;
    }

    /* INVOICE PREVIEW */
    .invoice-preview {
      background: white;
      border-radius: 1.8rem;
      padding: 2rem 2.2rem;
      box-shadow: 0 20px 35px rgba(0,0,0,0.15);
      font-size: 0.9rem;
      color: #1f2937;
      max-width: 100%;
      overflow-x: auto;
    }
    .invoice-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 1.8rem;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .logo-icon {
      background: #0f172a;
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.3rem;
      text-transform: uppercase;
    }
    .company-info {
      font-size: 0.8rem;
      color: #4b5563;
      line-height: 1.4;
    }
    .invoice-title {
      text-align: right;
    }
    .invoice-title h2 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #0f172a;
      margin-bottom: 0.2rem;
    }
    .invoice-number, .dates {
      font-weight: 500;
    }
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin: 1.8rem 0;
      border-top: 1px solid #e5e7eb;
      padding-top: 1.5rem;
    }
    .section-title {
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: #6b7280;
      letter-spacing: 0.04em;
      border-bottom: 1px solid #e5e7eb;
      margin-bottom: 0.8rem;
      padding-bottom: 0.3rem;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.3rem;
      font-size: 0.9rem;
    }
    .detail-label {
      font-weight: 500;
      color: #4b5563;
    }
    .tow-details {
      background: #f8fafc;
      border-radius: 1rem;
      padding: 1.2rem;
      margin: 1.5rem 0;
    }
    .charges-table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.2rem 0;
    }
    .charges-table th {
      text-align: left;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #64748b;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #d1d5db;
    }
    .charges-table td {
      padding: 0.6rem 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .total-row {
      font-weight: 700;
      font-size: 1.1rem;
    }
    .payment-notes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-top: 1.8rem;
    }
    .payment-methods {
      background: #f1f5f9;
      padding: 1rem;
      border-radius: 0.9rem;
      font-size: 0.85rem;
    }
    .signature-line {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
      border-top: 1px solid #d1d5db;
      padding-top: 1.2rem;
      font-size: 0.8rem;
      color: #4b5563;
      font-weight: 500;
    }
    .footer-note {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.7rem;
      color: #9ca3af;
    }
    hr {
      border: 0.5px solid #e5e7eb;
      margin: 1rem 0;
    }
    .distance-badge-inline {
      background: #eef2ff;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #1e3a8a;
    }
    @media (max-width: 600px) {
      .grid-2col, .payment-notes-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      .invoice-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    /* PRINT STYLES */
    @media print {
      body {
        background: white;
        padding: 0;
        margin: 0;
      }
      .form-card,
      .action-row,
      .container > h3,
      .container > p,
      #updateInvoiceBtn,
      #printBtn,
      .no-print {
        display: none !important;
      }
      .container {
        max-width: 100%;
        width: 100%;
        gap: 0;
      }
      .invoice-preview {
        box-shadow: none;
        border-radius: 0;
        padding: 0.5in;
        margin: 0;
        width: 100%;
        max-width: 100%;
        overflow-x: visible;
      }
      .invoice-preview {
        page-break-after: avoid;
        page-break-inside: avoid;
      }
      .invoice-preview {
        font-size: 10pt;
      }
      .invoice-title h2 {
        font-size: 18pt;
      }
      .tow-details,
      .payment-methods {
        background: #f8fafc !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .section-title {
        border-bottom: 1px solid #e5e7eb !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- EDITABLE FORM -->
  <div class="form-card no-print">
    <h3 style="margin-bottom:1.5rem; display: flex; align-items: center; gap:0.5rem;">📋 Invoice Data</h3>
    <div class="form-grid" id="invoiceForm">
      <div class="field-group">
        <label>Invoice #</label>
        <input type="text" id="invNumber" placeholder="INV-2026-01" value="INV-2026-101">
      </div>
      <div class="field-group">
        <label>Date</label>
        <input type="date" id="invDate" value="2026-06-18">
      </div>
      <div class="field-group">
        <label>Due Date</label>
        <input type="date" id="invDue" value="2026-06-30">
      </div>
      <div class="field-group full-width">
        <label>Company Info</label>
        <input type="text" id="companyAddress" value="4425 W Airport Fwy, Irving TX 75062" placeholder="Address">
      </div>
      
      <!-- Customer -->
      <div class="field-group">
        <label>Customer Name</label>
        <input type="text" id="custName" value="Alex Rivera">
      </div>
      <div class="field-group">
        <label>Phone</label>
        <input type="text" id="custPhone" value="(214) 555-7890">
      </div>
      <div class="field-group full-width">
        <label>Address</label>
        <input type="text" id="custAddress" value="1234 Main St, Irving, TX 75060">
      </div>
      
      <!-- Vehicle -->
      <div class="field-group">
        <label>Year/Make/Model</label>
        <input type="text" id="vehicleModel" value="2022 Ford F-150">
      </div>
      <div class="field-group">
        <label>Plate</label>
        <input type="text" id="vehiclePlate" value="TX-ABC123">
      </div>
      <div class="field-group">
        <label>Color</label>
        <input type="text" id="vehicleColor" value="Silver">
      </div>
      
      <!-- Tow details -->
      <div class="field-group">
        <label>Pickup Location</label>
        <input type="text" id="pickup" value="I-35 &amp; Royal Ln, Dallas">
      </div>
      <div class="field-group">
        <label>Drop-off</label>
        <input type="text" id="dropoff" value="930 N Belt Line Rd, Suite 142, Irving, TX 75061">
      </div>
      <div class="field-group">
        <label>Reason</label>
        <input type="text" id="reason" value="Vehicle Breakdown">
      </div>
      <div class="field-group">
        <label>Service Date</label>
        <input type="date" id="serviceDate" value="2026-06-18">
      </div>

      <!-- Distance + automatic fee -->
      <div class="field-group full-width">
        <label style="margin-bottom:0.2rem;">🚛 Distance &amp; Towing Fee (auto-calc)</label>
        <div class="distance-grid">
          <span>Miles:</span>
          <input type="number" id="towMiles" min="0" step="0.5" value="34" style="max-width:90px; padding:0.4rem 0.6rem;">
          <span class="badge">0–10: $100</span>
          <span class="badge">10–20: $150</span>
          <span class="badge">20–30: $175</span>
          <span class="badge">30–40: $230</span>
          <span class="badge">40–50: $270</span>
          <span style="font-weight:600; margin-left:auto;">Fee: $<span id="distanceFeeDisplay">230.00</span></span>
        </div>
      </div>

      <!-- Charges editable (desc + amount) but amount1 will be overridden by distance fee if enabled -->
      <div class="full-width" style="margin-top:0.5rem;">
        <label style="margin-bottom:0.5rem; display:block;">Charges (edit descriptions &amp; extra fee)</label>
        <div class="inline-charges">
          <input type="text" id="desc1" value="Towing Fee (distance based)" placeholder="Description">
          <input type="number" id="amount1" value="230.00" step="0.01" style="max-width:120px;" class="small-input">
          <span style="font-size:0.7rem; color:#475569;">(auto-updates with miles)</span>
        </div>
        <div class="inline-charges" style="margin-top:0.5rem;">
          <input type="text" id="desc2" value="Fairtow Service Fee" placeholder="Description">
          <input type="number" id="amount2" value="30.00" step="0.01" style="max-width:120px;" class="small-input">
        </div>
        <div style="margin-top:0.7rem; font-weight:600; text-align:right;" id="totalPreview">Total: $260.00</div>
      </div>
      
      <!-- Payment & notes -->
      <div class="field-group full-width">
        <label>Payment methods (comma separated)</label>
        <input type="text" id="paymentMethods" value="Zelle: hasnath@fairpy.com, Cash App: $Fairental, Pay Via Mobi/Turo/Stripe, Cash / Card">
      </div>
      <div class="field-group full-width">
        <label>Notes</label>
        <textarea id="notesText" rows="2" placeholder="Additional notes...">Tow completed safely. Customer notified.</textarea>
      </div>
    </div>
    <div class="action-row">
      <button id="updateInvoiceBtn" class="update-btn">↻ Refresh Invoice Preview</button>
      <button id="printBtn">🖨️ Print Invoice Only</button>
    </div>
    <p style="font-size:0.75rem; color:#6b7280; margin-top:0.8rem;">Edit fields and click print — only the invoice will be printed.</p>
  </div>

  <!-- INVOICE PREVIEW -->
  <div class="invoice-preview" id="invoicePreview">
    <!-- dynamically filled via JS -->
  </div>
  
</div>

<script>
  (function() {
    const get = (id) => document.getElementById(id);

    // DOM refs
    const fields = {
      invNumber: get('invNumber'),
      invDate: get('invDate'),
      invDue: get('invDue'),
      companyAddress: get('companyAddress'),
      custName: get('custName'),
      custPhone: get('custPhone'),
      custAddress: get('custAddress'),
      vehicleModel: get('vehicleModel'),
      vehiclePlate: get('vehiclePlate'),
      vehicleColor: get('vehicleColor'),
      pickup: get('pickup'),
      dropoff: get('dropoff'),
      reason: get('reason'),
      serviceDate: get('serviceDate'),
      desc1: get('desc1'),
      amount1: get('amount1'),
      desc2: get('desc2'),
      amount2: get('amount2'),
      paymentMethods: get('paymentMethods'),
      notesText: get('notesText'),
      towMiles: get('towMiles')
    };

    const distanceFeeDisplay = get('distanceFeeDisplay');
    const totalPreviewSpan = get('totalPreview');
    const invoicePreviewDiv = get('invoicePreview');

    // Distance fee lookup
    function getDistanceFee(miles) {
      const m = parseFloat(miles);
      if (isNaN(m) || m < 0) return 0;
      if (m <= 10) return 100;
      if (m <= 20) return 150;
      if (m <= 30) return 175;
      if (m <= 40) return 230;
      if (m <= 50) return 270;
      return 270; // >50 stays 270 (can be adjusted)
    }

    function formatMoney(value) {
      let num = parseFloat(value);
      if (isNaN(num)) num = 0;
      return num.toFixed(2);
    }

    // Update total preview + distance fee display
    function updateTotals() {
      const miles = parseFloat(fields.towMiles.value) || 0;
      const fee = getDistanceFee(miles);
      const amt1 = fee; // override amount1 with distance fee
      const amt2 = parseFloat(fields.amount2.value) || 0;
      const total = amt1 + amt2;
      
      // update amount1 field to reflect distance fee (keep editable but overridden)
      fields.amount1.value = amt1.toFixed(2);
      distanceFeeDisplay.textContent = amt1.toFixed(2);
      totalPreviewSpan.textContent = `Total: $${total.toFixed(2)}`;
    }

    // attach listeners for miles & amount2
    fields.towMiles.addEventListener('input', function() {
      updateTotals();
      // also re-render preview after short delay
      scheduleRender();
    });
    fields.amount2.addEventListener('input', function() {
      updateTotals();
      scheduleRender();
    });

    // helper to schedule render
    let renderTimeout;
    function scheduleRender() {
      clearTimeout(renderTimeout);
      renderTimeout = setTimeout(() => {
        renderInvoice();
      }, 150);
    }

    // escape
    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatDate(dateString) {
      if (!dateString) return '';
      const d = new Date(dateString);
      if (isNaN(d)) return '';
      const utc = new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
      return utc.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    }

    // Generate invoice HTML
    function generateInvoiceHTML() {
      const miles = parseFloat(fields.towMiles.value) || 0;
      const fee = getDistanceFee(miles);
      const amt2 = parseFloat(fields.amount2.value) || 0;
      const totalDue = fee + amt2;

      const invDateFormatted = formatDate(fields.invDate.value);
      const dueDateFormatted = formatDate(fields.invDue.value);
      const serviceDateFormatted = formatDate(fields.serviceDate.value);

      const paymentRaw = fields.paymentMethods.value || '';
      const paymentLines = paymentRaw.split(',').map(s => s.trim()).filter(s => s.length > 0);
      const notesContent = fields.notesText.value || '';

      // Build distance label for preview
      let distanceLabel = `${miles} miles`;
      let feeRange = '';
      if (miles <= 10) feeRange = '(0–10 mi)';
      else if (miles <= 20) feeRange = '(10–20 mi)';
      else if (miles <= 30) feeRange = '(20–30 mi)';
      else if (miles <= 40) feeRange = '(30–40 mi)';
      else if (miles <= 50) feeRange = '(40–50 mi)';
      else feeRange = '(>50 mi)';

      return `
        <div class="invoice-header">
          <div class="logo-area">
            <div class="logo-icon"><img src="./Picture1.jpg" alt=""></div>
            <div class="company-info">
              <strong>Fairpy Inc</strong><br>
              ${escapeHtml(fields.companyAddress.value)}<br>
              (214) 702-9736 | rental@fairpy.com
            </div>
          </div>
          <div class="invoice-title">
            <h2>TOW INVOICE</h2>
            <div class="invoice-number"><strong>${escapeHtml(fields.invNumber.value)}</strong></div>
            <div class="dates">Date: ${escapeHtml(invDateFormatted)}</div>
            <div class="dates">Due: ${escapeHtml(dueDateFormatted)}</div>
          </div>
        </div>

        <div class="grid-2col">
          <div>
            <div class="section-title">CUSTOMER</div>
            <div class="detail-row"><span class="detail-label">Name</span> ${escapeHtml(fields.custName.value)}</div>
            <div class="detail-row"><span class="detail-label">Phone</span> ${escapeHtml(fields.custPhone.value)}</div>
            <div class="detail-row"><span class="detail-label">Address</span> ${escapeHtml(fields.custAddress.value)}</div>
          </div>
          <div>
            <div class="section-title">VEHICLE</div>
            <div class="detail-row"><span class="detail-label">Year/Make/Model</span> ${escapeHtml(fields.vehicleModel.value)}</div>
            <div class="detail-row"><span class="detail-label">Plate</span> ${escapeHtml(fields.vehiclePlate.value)}</div>
            <div class="detail-row"><span class="detail-label">Color</span> ${escapeHtml(fields.vehicleColor.value)}</div>
          </div>
        </div>

        <div class="tow-details">
          <div class="section-title" style="margin-top:0;">TOW DETAILS</div>
          <div class="detail-row"><span class="detail-label">Pickup</span> ${escapeHtml(fields.pickup.value)}</div>
          <div class="detail-row"><span class="detail-label">Drop-off</span> ${escapeHtml(fields.dropoff.value)}</div>
          <div class="detail-row"><span class="detail-label">Reason</span> ${escapeHtml(fields.reason.value)}</div>
          <div class="detail-row"><span class="detail-label">Service Date</span> ${escapeHtml(serviceDateFormatted)}</div>
          <div class="detail-row" style="margin-top:0.5rem; background:#eef2ff; padding:0.4rem 0.8rem; border-radius:30px;">
            <span class="detail-label">📏 Distance</span>
            <span><strong>${escapeHtml(distanceLabel)}</strong> <span class="distance-badge-inline">${escapeHtml(feeRange)}</span></span>
          </div>
        </div>

        <div class="section-title">CHARGES</div>
        <table class="charges-table">
          <thead><tr><th>Description</th><th>Note</th><th style="text-align:right;">Amount</th></tr></thead>
          <tbody>
            <tr>
              <td>${escapeHtml(fields.desc1.value)}</td>
              <td>${escapeHtml(feeRange)}</td>
              <td style="text-align:right;">$${formatMoney(fee)}</td>
            </tr>
            <tr>
              <td>${escapeHtml(fields.desc2.value)}</td>
              <td>—</td>
              <td style="text-align:right;">$${formatMoney(amt2)}</td>
            </tr>
            <tr class="total-row">
              <td colspan="2"><strong>TOTAL DUE</strong></td>
              <td style="text-align:right;"><strong>$${totalDue.toFixed(2)}</strong></td>
            </tr>
          </tbody>
        </table>

        <div class="payment-notes-grid">
          <div>
            <div class="section-title">PAYMENT</div>
            <div class="payment-methods">
              ${paymentLines.map(line => `<div>✓ ${escapeHtml(line)}</div>`).join('')}
            </div>
          </div>
          <div>
            <div class="section-title">NOTES</div>
            <div style="font-size:0.9rem; color:#374151;">${escapeHtml(notesContent) || '—'}</div>
          </div>
        </div>

        <div class="signature-line">
          <span>Fairpy Inc Representative</span>
          <span>Customer Signature & Date</span>
        </div>
        <div class="footer-note">
          Fairpy Inc • Irving, TX • (214) 702-9736 • claims@fairpy.com • www.fairental.com
        </div>
      `;
    }

    function renderInvoice() {
      if (invoicePreviewDiv) {
        invoicePreviewDiv.innerHTML = generateInvoiceHTML();
      }
      updateTotals();
    }

    // Event: update button
    get('updateInvoiceBtn').addEventListener('click', (e) => {
      e.preventDefault();
      renderInvoice();
    });

    // Print
    get('printBtn').addEventListener('click', (e) => {
      e.preventDefault();
      renderInvoice();
      setTimeout(() => {
        window.print();
      }, 120);
    });

    // Auto-update on any input
    const allInputs = document.querySelectorAll('#invoiceForm input, #invoiceForm textarea');
    allInputs.forEach(input => {
      input.addEventListener('input', function() {
        scheduleRender();
      });
    });

    // initial render
    renderInvoice();
    updateTotals();
  })();
</script>
</body>
</html>
